<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-html-version" content="0.38" />
    <title>Flickr Album Viewer</title>
    <link rel="stylesheet" href="styles.css?v=0.38" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div class="title-row">
          <h1 id="album-title">Album Viewer</h1>
          <p id="photo-count">Loading photos...</p>
        </div>
      </header>

      <section id="loading-state" class="state-card" aria-live="polite">
        <p>Loading album photos...</p>
      </section>

      <section id="error-state" class="state-card hidden" aria-live="assertive">
        <h2>Couldn’t load this album</h2>
        <p id="error-message">Please try again.</p>
        <button id="retry-button" class="btn" type="button">Retry</button>
      </section>

      <section id="empty-state" class="state-card hidden" aria-live="polite">
        <h2>No photos found</h2>
        <p>This album does not have any publicly available photos.</p>
      </section>
      <!-- Compact header shown above the viewer in landscape to allow a small scroll
           and provide quick access to album title, photo count, and albums back link. -->
      <div id="mobile-compact" class="mobile-compact" aria-hidden="true">
        <button id="back-to-albums-compact" class="back-btn compact-back" type="button" aria-hidden="true" style="display:none">← Albums</button>
        <div class="compact-title">
          <div id="mobile-album-title" class="compact-album-title"></div>
          <div id="mobile-photo-count" class="compact-photo-count"></div>
        </div>
      </div>
      <div id="mobile-scroll-spacer" aria-hidden="true"></div>

      <section id="theatre-view" class="theatre-view hidden" aria-label="Album viewer">
        <div id="preview-pane" class="preview-pane">
          <button
            id="preview-fullscreen-toggle"
            class="preview-fullscreen-btn"
            type="button"
            aria-label="Expand photo"
            title="Expand photo"
          >
            ⤢
          </button>
          <button id="prev-photo" class="preview-nav prev-btn" type="button" aria-label="Previous photo">‹</button>
          <div class="preview-media">
            <img id="preview-image" src="" alt="" />
          </div>
          <button id="next-photo" class="preview-nav next-btn" type="button" aria-label="Next photo">›</button>
        </div>

        <div
          id="filmstrip-resizer"
          class="filmstrip-resizer"
          role="separator"
          aria-label="Resize filmstrip"
          aria-orientation="horizontal"
        ></div>

        <div id="filmstrip" class="filmstrip" aria-label="Photo thumbnails"></div>
      </section>

      <p id="app-version" class="version-badge" aria-live="polite"></p>
    </main>

    <script src="app-config.js?v=0.38"></script>
    <script src="app.js?v=0.38"></script>

    <br/>
    <br/>
    <br/>
</body>
</html>
