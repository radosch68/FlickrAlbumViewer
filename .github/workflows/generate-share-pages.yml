name: Generate share pages

# Allow the runner to write generated files back to the repo using the
# automatically provided `GITHUB_TOKEN` when repository settings allow it.
permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      albumName:
        description: 'Album name (optional)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install (no deps required)
        run: echo 'Using built-in node; no install needed'

      - name: Run generator for default album
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          FLICKR_USER_ID: ${{ secrets.FLICKR_USER_ID }}
          SITE_BASE: ${{ secrets.SITE_BASE_URL }}
        run: |
          node scripts/generate-share-pages.js --albumName "${{ github.event.inputs.albumName || '' }}"

      - name: Detect generated share file
        id: detect_share
        run: |
          # Stage any generated files and detect the album HTML created/modified in this run
          git add share || true
          files=$(git diff --staged --name-only --diff-filter=AM | grep '^share/album-.*\.html$' || true)
          first=$(echo "$files" | head -n1)
          if [ -n "$first" ]; then
            echo "Detected generated file: $first"
            echo "share_file=$first" >> $GITHUB_OUTPUT
          else
            echo 'No generated share file detected'
            echo "share_file=" >> $GITHUB_OUTPUT
          fi

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share || true
          if ! git diff --staged --quiet; then
            git commit -m "Generate share pages [ci]" || echo 'No changes to commit'
            git push
          else
            echo 'No generated changes'
          fi

      - name: Show generated share URL
        if: always()
        run: |
          repo_full="$GITHUB_REPOSITORY"
          owner="${repo_full%%/*}"
          repo="${repo_full##*/}"
          site_base="https://${owner}.github.io/${repo}"
          share_file="${{ steps.detect_share.outputs.share_file }}"
          if [ -n "$share_file" ]; then
            url="$site_base/${share_file}"
            echo "Generated share page: $url"
          else
            echo 'No generated share file to show.'
          fi
