name: Generate share pages

# Allow the runner to write generated files back to the repo using the
# automatically provided `GITHUB_TOKEN` when repository settings allow it.
permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      albumName:
        description: 'Album name (optional)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      share_url: ${{ steps.show_share.outputs.share_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install (no deps required)
        run: echo 'Using built-in node; no install needed'

      - name: Run generator for default album
        id: generate
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          FLICKR_USER_ID: ${{ secrets.FLICKR_USER_ID }}
          SITE_BASE: ${{ secrets.SITE_BASE_URL }}
        run: |
          node scripts/generate-share-pages.js --albumName "${{ github.event.inputs.albumName || '' }}"

      # staging is handled in the Commit step (git add share)

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "-- git status (before add) --"
          git status --porcelain --branch || true
          # Stage all changes (including untracked files)
          git add -A || true
          echo "-- git ls-files (added) --"
          git ls-files --others --exclude-standard --directory || true
          echo "-- git diff --staged --name-only -- (staged files) --"
          git diff --staged --name-only || true
          if ! git diff --staged --quiet; then
            echo "Staged changes detected. Committing..."
            git commit -m "Generate share pages [ci]" || echo 'No changes to commit'
            echo "Pushing changes..."
            git push || echo 'Push failed'
          else
            echo 'No generated changes'
          fi

      - name: Show generated share URL
        id: show_share
        if: always()
        run: |
          repo_full="$GITHUB_REPOSITORY"
          owner="${repo_full%%/*}"
          repo="${repo_full##*/}"
          site_base="https://${owner}.github.io/${repo}"
          share_file="${{ steps.generate.outputs.share_file }}"
          if [ -n "$share_file" ]; then
            url="$site_base/${share_file}"
            echo "$url"
            echo "share_url=$url" >> $GITHUB_OUTPUT
          else
            echo 'No generated share file to show.'
            echo "share_url=" >> $GITHUB_OUTPUT
          fi

      - name: Add generated filename to job summary
        if: always()
        run: |
          share_file="${{ steps.generate.outputs.share_file }}"
          share_url="https://radosch68.github.io/FlickrAlbumViewer/${{ steps.show_share.outputs.share_file }}"
          if [ -n "$share_file" ]; then
            echo "### Generated share file" >> $GITHUB_STEP_SUMMARY
            echo "[$share_url]($share_url)" >> $GITHUB_STEP_SUMMARY
          else
            echo "No generated share file" >> $GITHUB_STEP_SUMMARY
          fi